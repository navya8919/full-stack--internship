<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Day 3 JavaScript Assignment</title>
</head>

<body>

    <h1>JavaScript Assignments</h1>

    <!-- 1. Positive / Negative / Zero -->
    <h2>Check Number Type</h2>
    <input type="number" id="checkNum" placeholder="Enter a number">
    <button onclick="checkNumber()">Check</button>
    <p id="checkResult"></p>

    <hr>

    <!-- 2. Max of 3 Numbers -->
    <h2>Find Largest Number</h2>
    <input type="number" id="numA" placeholder="Enter A">
    <input type="number" id="numB" placeholder="Enter B">
    <input type="number" id="numC" placeholder="Enter C">
    <button onclick="findMax()">Find Max</button>
    <p id="maxResult"></p>

    <hr>

    <!-- 3. Multiplication Table -->
    <h2>Multiplication Table</h2>
    <input type="number" id="tableNum" placeholder="Enter number">
    <button onclick="printTable()">Generate Table</button>
    <pre id="tableResult"></pre>

    <hr>

    <!-- 4. Calculator + Even/Odd -->
    <h2>Calculator</h2>
    <input type="number" id="num1" placeholder="First number">
    <input type="number" id="num2" placeholder="Second number">

    <br><br>

    <button onclick="add()">Add</button>
    <button onclick="subtract()">Subtract</button>
    <button onclick="multiply()">Multiply</button>
    <button onclick="divide()">Divide</button>
    <button onclick="checkEvenOdd()">Even/Odd</button>

    <p id="calcResult"></p>

    <!-- Link JavaScript -->
    <script src="script.js"></script>

</body>

</html>
